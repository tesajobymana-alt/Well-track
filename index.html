<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Well Track + GlowBot</title><link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffe066,#ffd43b,#fff3bf,#fcc419);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:white;
overflow-x:hidden;
min-height:100vh;
transition:1s;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.bg1,.bg2,.bg3{
position:fixed;
border-radius:50%;
filter:blur(80px);
z-index:-5;
opacity:0.5;
}

.bg1{width:300px;height:300px;background:#fff3bf;top:-100px;left:-100px;}
.bg2{width:250px;height:250px;background:#ffd43b;bottom:-80px;right:-80px;}
.bg3{width:200px;height:200px;background:#ffe066;top:40%;left:60%;}

.stars{
position:fixed;
width:100%;
height:100%;
background-image:radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
opacity:0.2;
z-index:-4;
animation:starsMove 20s linear infinite;
}

@keyframes starsMove{0%{transform:translateY(0px);}100%{transform:translateY(-200px);}}

.floating{
position:fixed;
font-size:30px;
animation:floatAround 6s infinite ease-in-out;
z-index:-3;
opacity:0.7;
}

.floating1{top:15%;left:8%;}
.floating2{top:70%;left:85%;animation-delay:1s;}
.floating3{top:40%;left:75%;animation-delay:2s;}
.floating4{top:80%;left:20%;animation-delay:3s;}

@keyframes floatAround{
0%{transform:translateY(0px);}50%{transform:translateY(-20px);}100%{transform:translateY(0px);}
}

.wave{
position:fixed;
bottom:0;
width:100%;
height:120px;
background:rgba(255,255,255,0.15);
border-radius:50% 50% 0 0;
filter:blur(20px);
z-index:-2;
}

.moon{
position:fixed;
top:40px;
right:40px;
width:90px;
height:90px;
background:rgba(255,255,255,0.4);
border-radius:50%;
box-shadow:0 0 40px white;
z-index:-2;
}

.screen{display:none;padding:20px;padding-bottom:100px;}
.active{display:block;}

h1,h2{text-align:center;}

.card{
background:rgba(255,255,255,0.18);
backdrop-filter:blur(14px);
border-radius:24px;
padding:20px;
margin:15px 0;
border:1px solid rgba(255,255,255,0.25);
box-shadow:0 8px 32px rgba(0,0,0,0.15);
transition:0.3s;
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 25px rgba(255,213,79,0.5);
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#f59f00,#fcc419);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
position:relative;
overflow:hidden;
}

button:active{
transform:scale(0.97);
}

.small{width:30%;display:inline-block;}

input{
width:100%;padding:12px;border:none;border-radius:12px;margin-top:8px;box-sizing:border-box;}

.nav{
position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;padding:12px;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);
}

.nav button{width:auto;margin:0;font-size:18px;}

.robotGlow{
width:170px;height:170px;margin:auto;border-radius:40px;display:flex;align-items:center;justify-content:center;background:white;box-shadow:0 0 60px white;animation:float 3s infinite ease-in-out;font-size:85px;transition:0.5s;position:relative;
}

.robotGlow.pulse{
animation:pulseGlow 0.6s ease;
}

@keyframes pulseGlow{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

.breathCircle{width:120px;height:120px;border-radius:50%;background:#ffd43b;margin:20px auto;animation:breathe 4s infinite;box-shadow:0 0 40px yellow;}

@keyframes breathe{0%{transform:scale(0.8);}50%{transform:scale(1.1);}100%{transform:scale(0.8);}}

.progress{width:100%;height:20px;background:white;border-radius:20px;overflow:hidden;margin-top:10px;}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#fcc419,#ffd43b);transition:1s;}

.center{text-align:center;}

/* TOAST */
.toast{
position:fixed;
bottom:80px;
left:50%;
transform:translateX(-50%);
background:#fff3bf;
color:#5c4300;
padding:12px 18px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
opacity:0;
transition:0.5s;
z-index:999;
}

.toast.show{opacity:1;}

</style></head><body><div class="bg1"></div>
<div class="bg2"></div>
<div class="bg3"></div>
<div class="stars"></div><div class="floating floating1">✨</div>
<div class="floating floating2">🌟</div>
<div class="floating floating3">⭐</div>
<div class="floating floating4">💫</div><div class="moon"></div>
<div class="wave"></div><div class="toast" id="toast"></div><div id="home" class="screen active"><h1>Well Track</h1><div class="card">
<h3>👤 Your Name</h3>
<input id="nameInput" placeholder="Enter your name">
<button onclick="saveName()">Save Name</button>
<p id="username"></p>
</div><div class="card">
<h3>🔥 Streak: <span id="streak">0</span></h3>
<h3>⭐ Points: <span id="points">0</span></h3>
<h3>🏆 Badge: <span id="badge">Beginner</span></h3>
</div><div class="card">
<h3>💡 Daily Tip</h3>
<p id="tip"></p>
</div><div class="card">
<h3>⚡ Body Energy Sync</h3>
<p id="energyText">GlowBot energy is stable 🌿</p>
<div class="progress"><div id="energyBar" class="bar" style="width:70%"></div></div>
</div></div><div id="mental" class="screen"><h2>🌟 GlowBot</h2><div class="card">
<div id="robotGlow" class="robotGlow">🌟</div>
<p id="robotText" class="center">GlowBot is ready ✨</p>
</div><div class="card">
<h3>Mood Check</h3>
<button class="small" onclick="setMood('happy')">Happy</button>
<button class="small" onclick="setMood('sad')">Sad</button>
<button class="small" onclick="setMood('calm')">Calm</button>
<p id="moodText"></p>
</div><div class="card">
<h3>🌬 Breathing Exercise</h3>
<div class="breathCircle"></div>
<button onclick="breathing()">Start</button>
<p id="breath"></p>
</div></div><div class="nav">
<button onclick="show('home')"><i class="fa-solid fa-house"></i></button>
<button onclick="show('mental')"><i class="fa-solid fa-brain"></i></button>
</div><script>

function show(s){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
document.getElementById(s).classList.add('active');
}

function toast(msg){
let t=document.getElementById('toast');
t.innerText=msg;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
}

function saveName(){
let n=document.getElementById('nameInput').value;
document.getElementById('username').innerText='Hi '+n+' 👋';
toast('Name saved!');
}

function setMood(m){
let glow=document.getElementById('robotGlow');
glow.classList.add('pulse');
setTimeout(()=>glow.classList.remove('pulse'),600);
toast('Mood updated!');
}

function breathing(){
document.getElementById('breath').innerText='Inhale... Exhale... 🌬';
toast('Relax mode on');
}

// energy animation
window.onload=function(){
let bar=document.getElementById('energyBar');
bar.style.width='0%';
setTimeout(()=>bar.style.width='70%',500);

let tips=['Drink water 💧','Sleep early 😴','Take breaks 📚','Stretch 🏃','Stay positive ✨'];
document.getElementById('tip').innerText=tips[Math.floor(Math.random()*tips.length)];
};

</script></body>
</html>
